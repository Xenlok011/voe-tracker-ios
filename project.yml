name: VoeTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  VoeTracker:
    type: application
    platform: iOS
    sources:
      - path: VoeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.voetracker
        INFOPLIST_FILE: VoeTracker/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO